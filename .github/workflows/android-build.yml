
name: Build Crawless Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CrawlessLauncher_Source.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract launcher source
        run: |
          mkdir launcher
          unzip -o CrawlessLauncher_Source.zip -d launcher

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR="$(find launcher -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: CrawlessLauncher-APK
          path: launcher/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
